# Deliberately does not run the RAGAS eval suite (src/run_eval.py). It needs both the
# private source document (data/ is gitignored — CI has no vector store to retrieve
# from) and a real Groq quota, so it stays a manual pre-merge command instead of
# something that would either fail to fetch private data or burn API quota on every
# push. See docs/evaluation.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The suite stubs the agent, so no model is ever called. A placeholder key is
      # still required because ChatGroq is constructed at import time.
      GROQ_API_KEY: test-key-not-used
      # Left unset deliberately: tracing then no-ops, which is the path a fresh clone
      # takes and therefore the one worth testing.
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel pulls ~2GB of CUDA libraries that a CI
          # runner cannot use, and installing it first stops sentence-transformers
          # resolving the GPU build.
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-api.txt
          pip install pytest

      - name: Verify no CUDA build leaked in
        run: python -c "import torch; assert not torch.version.cuda, 'CUDA torch in CI'"

      - name: Run tests
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # The Dockerfile asserts torch is the CPU build, so a regression that
          # re-introduced 7GB of CUDA libraries would fail here rather than ship.
          cache-from: type=gha
          cache-to: type=gha,mode=max
